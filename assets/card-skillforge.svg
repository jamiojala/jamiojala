<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">SkillForge</title><desc id="desc">A local-first orchestration layer connects models, tools, and portable skills.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071311"/><stop offset="1" stop-color="#07090e"/></linearGradient><linearGradient id="net" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e7ff"/><stop offset="1" stop-color="#b4ff68"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#162a27"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.1em}.ring{transform-origin:548px 181px;animation:spin 18s linear infinite}.ring2{transform-origin:548px 181px;animation:rev 11s linear infinite}.dash{stroke-dasharray:4 7;animation:dash 6s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rev{to{transform:rotate(-360deg)}}@keyframes dash{to{stroke-dashoffset:-66}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.ring,.ring2,.dash,.pulse{animation:none!important}.motion{display:none}}</style><path id="flow" d="M548 90 C640 90 664 136 664 181 C664 228 626 270 548 270 C468 270 430 228 430 181 C430 134 468 90 548 90"/></defs>
  <rect width="760" height="360" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="758" height="358" rx="21" fill="none" stroke="#243b37"/><rect x="1" y="1" width="758" height="358" rx="21" fill="url(#grid)" opacity=".22"/>
  <text x="34" y="43" class="mono" font-size="11" fill="#55e7ff">OPEN SYSTEM / 04</text><circle cx="706" cy="38" r="4" fill="#55e7ff" class="pulse"/><text x="693" y="42" text-anchor="end" class="mono" font-size="9" fill="#79deec">ORCHESTRATING</text>
  <text x="34" y="105" font-size="36" font-weight="780" letter-spacing="-1.4" fill="#f4f7fb">skillforge</text><text x="34" y="137" font-size="14" fill="#8fa49f">Models change. Skills should travel.</text>
  <text x="34" y="191" class="mono" font-size="10" fill="#59746e">LOCAL-FIRST LAYER</text><path d="M34 205H294" stroke="#263d38"/><text x="34" y="232" font-size="12" fill="#c4d0cd">MCP</text><text x="74" y="232" fill="#49635d">/</text><text x="94" y="232" font-size="12" fill="#c4d0cd">skills</text><text x="145" y="232" fill="#49635d">/</text><text x="165" y="232" font-size="12" fill="#c4d0cd">agents</text><text x="224" y="232" fill="#49635d">/</text><text x="244" y="232" font-size="12" fill="#c4d0cd">memory</text>
  <rect x="34" y="293" width="91" height="30" rx="15" fill="#0f1917" stroke="#294a43"/><text x="80" y="312" text-anchor="middle" class="mono" font-size="9" fill="#83aaa1">PYTHON</text><rect x="134" y="293" width="80" height="30" rx="15" fill="#0f1917" stroke="#294a43"/><text x="174" y="312" text-anchor="middle" class="mono" font-size="9" fill="#83aaa1">MCP</text>
  <rect x="355" y="55" width="365" height="250" rx="16" fill="#080f0e" stroke="#29413d"/>
  <path d="M548 181L468 112M548 181L628 112M548 181L468 250M548 181L628 250" stroke="#263f3a" class="dash"/>
  <g class="ring"><ellipse cx="548" cy="181" rx="118" ry="91" fill="none" stroke="#284741" stroke-dasharray="5 10"/><circle cx="548" cy="90" r="4" fill="#55e7ff" filter="url(#glow)"/></g><g class="ring2"><ellipse cx="548" cy="181" rx="94" ry="70" fill="none" stroke="url(#net)" stroke-width="2" stroke-dasharray="44 475"/><circle cx="642" cy="181" r="3" fill="#b4ff68"/></g>
  <g class="mono" font-size="8"><rect x="434" y="91" width="68" height="38" rx="9" fill="#0f1917" stroke="#315049"/><text x="468" y="114" text-anchor="middle" fill="#94b4ad">MODEL</text><rect x="594" y="91" width="68" height="38" rx="9" fill="#0f1917" stroke="#315049"/><text x="628" y="114" text-anchor="middle" fill="#94b4ad">TOOLS</text><rect x="434" y="231" width="68" height="38" rx="9" fill="#0f1917" stroke="#315049"/><text x="468" y="254" text-anchor="middle" fill="#94b4ad">MEMORY</text><rect x="594" y="231" width="68" height="38" rx="9" fill="#0f1917" stroke="#315049"/><text x="628" y="254" text-anchor="middle" fill="#94b4ad">SKILLS</text></g>
  <circle cx="548" cy="181" r="48" fill="#0d1715" stroke="#3c5b54"/><circle cx="548" cy="181" r="38" fill="none" stroke="#1d332f"/><text x="548" y="177" text-anchor="middle" class="mono" font-size="8" fill="#66827c">ORCHESTRATOR</text><text x="548" y="195" text-anchor="middle" class="mono" font-size="11" fill="#b4ff68">READY</text>
  <g class="motion"><circle r="4" fill="#55e7ff" filter="url(#glow)"><animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><circle r="4" fill="#b4ff68" filter="url(#glow)"><animateMotion dur="5.2s" begin="-2.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle></g>
  <text x="382" y="289" class="mono" font-size="8" fill="#587069">PORTABLE CAPABILITY, NOT PROMPT THEATRE.</text>
