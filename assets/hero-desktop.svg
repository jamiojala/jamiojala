<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Jami Ojala. Messy in. Systems out.</title>
  <desc id="desc">An animated operator console routes people, money, data, and judgment through a model, build, verify, and ship loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset="0.55" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#090713"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e7ff"/>
      <stop offset="0.52" stop-color="#8d7cff"/>
      <stop offset="1" stop-color="#b4ff68"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ab3"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="64%">
      <stop offset="0" stop-color="#151d2a"/>
      <stop offset="0.72" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#080a0f"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
    <filter id="glow-cyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lime" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="28" y="28" width="1544" height="704" rx="24"/></clipPath>

    <path id="route-people" d="M1108 247 C1162 247 1169 303 1203 329"/>
    <path id="route-money" d="M1108 489 C1164 489 1168 438 1203 411"/>
    <path id="route-data" d="M1424 247 C1370 247 1366 303 1331 329"/>
    <path id="route-judgment" d="M1424 489 C1370 489 1366 438 1331 411"/>
    <path id="route-output" d="M1267 489 V593"/>

    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .13em; }
      .route { fill: none; stroke: #293344; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 4 7; animation: route 8s linear infinite; }
      .orbit-a { transform-origin: 1267px 370px; animation: spin 22s linear infinite; }
      .orbit-b { transform-origin: 1267px 370px; animation: spin-reverse 14s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.5s steps(2, end) infinite; }
      .phase { opacity: 0; animation: phase 8s ease-in-out infinite; }
      .phase-2 { animation-delay: 2s; }
      .phase-3 { animation-delay: 4s; }
      .phase-4 { animation-delay: 6s; }
      .scan { animation: scan 7s cubic-bezier(.4,0,.2,1) infinite; }
      .bar { animation: bar 3.2s cubic-bezier(.4,0,.2,1) infinite; transform-origin: 1054px 635px; }
      .ticker { animation: ticker 10s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes route { to { stroke-dashoffset: -88; } }
      @keyframes pulse { 0%,100% { opacity:.48; } 50% { opacity:1; } }
      @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:.2; } }
      @keyframes phase { 0%,20% { opacity:1; transform:translateY(0); } 25%,95% { opacity:0; transform:translateY(-5px); } 100% { opacity:0; } }
      @keyframes scan { 0% { transform:translateY(-80px); opacity:0; } 12% { opacity:.65; } 70% { opacity:.18; } 100% { transform:translateY(760px); opacity:0; } }
      @keyframes bar { 0%,100% { transform:scaleX(.08); } 54% { transform:scaleX(1); } }
      @keyframes ticker { 0%,12% { transform:translateX(0); } 88%,100% { transform:translateX(-210px); } }
      @media (prefers-reduced-motion: reduce) {
        .route, .orbit-a, .orbit-b, .pulse, .blink, .scan, .bar, .ticker { animation:none !important; }
        .motion { display:none; }
        .phase { animation:none; opacity:0; }
        .phase-4 { opacity:1; }
        .bar { transform:scaleX(1); }
      }
    </style>
  </defs>

  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="704" rx="24" fill="none" stroke="#252c39"/>
  <g clip-path="url(#screen)">
    <rect x="28" y="28" width="1544" height="704" fill="url(#grid)" opacity=".34"/>
    <circle cx="1260" cy="350" r="380" fill="#5c4cff" opacity=".035"/>
    <circle cx="305" cy="620" r="360" fill="#24cbea" opacity=".025"/>
    <g class="scan"><rect x="28" y="0" width="1544" height="64" fill="url(#signal)" opacity=".055"/></g>
  </g>

  <!-- window chrome -->
  <circle cx="62" cy="62" r="5" fill="#ff5f57"/>
  <circle cx="80" cy="62" r="5" fill="#febc2e"/>
  <circle cx="98" cy="62" r="5" fill="#28c840"/>
  <text x="124" y="67" class="mono" font-size="12" fill="#8d96a8">JAMI_OS / FIELD SYSTEM</text>
  <text x="1404" y="67" class="mono" font-size="11" fill="#70798b">ESPOO, FI</text>
  <circle cx="1521" cy="62" r="5" fill="#aaff72" filter="url(#glow-lime)" class="blink"/>
  <text x="1508" y="67" text-anchor="end" class="mono" font-size="11" fill="#aaff72">LIVE</text>
  <path d="M28 94H1572" stroke="#252c39"/>

  <!-- identity -->
  <text x="74" y="143" class="mono" font-size="13" fill="#55e7ff">JAMI OJALA / FOUNDER-OPERATOR</text>
  <text x="72" y="249" font-size="94" font-weight="800" letter-spacing="-5" fill="#f5f7fb">MESSY IN.</text>
  <text x="72" y="351" font-size="94" font-weight="800" letter-spacing="-5" fill="#f5f7fb">SYSTEMS</text>
  <text x="72" y="453" font-size="94" font-weight="800" letter-spacing="-5" fill="url(#signal)">OUT.</text>
  <path d="M75 486H838" stroke="#252e3b"/>
  <path d="M75 486H338" stroke="url(#signal)" stroke-width="2"/>
  <text x="74" y="531" font-size="22" font-weight="520" fill="#d5dae4">I build software that survives contact with reality.</text>
  <text x="74" y="566" font-size="16" fill="#858fa3">Product systems × applied AI × operations</text>

  <g transform="translate(74 610)">
    <rect width="150" height="40" rx="20" fill="#0d121b" stroke="#263346"/>
    <circle cx="20" cy="20" r="4" fill="#55e7ff" class="pulse"/>
    <text x="36" y="25" class="mono" font-size="11" fill="#a7afbd">PRODUCT</text>
    <g transform="translate(162)">
      <rect width="132" height="40" rx="20" fill="#0d121b" stroke="#332e4a"/>
      <circle cx="20" cy="20" r="4" fill="#9a84ff" class="pulse" style="animation-delay:.5s"/>
      <text x="36" y="25" class="mono" font-size="11" fill="#a7afbd">AI</text>
    </g>
    <g transform="translate(306)">
      <rect width="168" height="40" rx="20" fill="#0d121b" stroke="#39442e"/>
      <circle cx="20" cy="20" r="4" fill="#b4ff68" class="pulse" style="animation-delay:1s"/>
      <text x="36" y="25" class="mono" font-size="11" fill="#a7afbd">OPERATIONS</text>
    </g>
  </g>

  <!-- live operator loop -->
  <rect x="972" y="116" width="556" height="544" rx="18" fill="#090c12" stroke="#2a3240"/>
  <path d="M972 166H1528" stroke="#242c38"/>
  <text x="1000" y="148" class="mono" font-size="11" fill="#d3d8e2">OPERATOR LOOP</text>
  <text x="1497" y="148" text-anchor="end" class="mono" font-size="10" fill="#7d8798">RUNNING / 04</text>
  <circle cx="1505" cy="144" r="4" fill="#55e7ff" class="pulse"/>

  <!-- routes -->
  <use href="#route-people" class="route"/>
  <use href="#route-money" class="route"/>
  <use href="#route-data" class="route"/>
  <use href="#route-judgment" class="route"/>
  <use href="#route-output" class="route"/>

  <!-- input nodes -->
  <g>
    <rect x="1000" y="222" width="108" height="50" rx="10" fill="#101620" stroke="#2a3e50"/>
    <text x="1016" y="243" class="mono" font-size="9" fill="#59677a">INPUT / 01</text>
    <text x="1016" y="260" class="mono" font-size="11" fill="#dce4ed">PEOPLE</text>
    <circle cx="1091" cy="247" r="4" fill="#55e7ff"/>

    <rect x="1000" y="464" width="108" height="50" rx="10" fill="#101620" stroke="#493a2b"/>
    <text x="1016" y="485" class="mono" font-size="9" fill="#74624d">INPUT / 02</text>
    <text x="1016" y="502" class="mono" font-size="11" fill="#dce4ed">MONEY</text>
    <circle cx="1091" cy="489" r="4" fill="#ffb84d"/>

    <rect x="1424" y="222" width="76" height="50" rx="10" fill="#101620" stroke="#3e3656"/>
    <text x="1437" y="243" class="mono" font-size="9" fill="#6e6488">IN / 03</text>
    <text x="1437" y="260" class="mono" font-size="11" fill="#dce4ed">DATA</text>
    <circle cx="1431" cy="247" r="4" fill="#9a84ff"/>

    <rect x="1382" y="464" width="118" height="50" rx="10" fill="#101620" stroke="#3b472e"/>
    <text x="1398" y="485" class="mono" font-size="9" fill="#657653">INPUT / 04</text>
    <text x="1398" y="502" class="mono" font-size="11" fill="#dce4ed">JUDGMENT</text>
    <circle cx="1389" cy="489" r="4" fill="#b4ff68"/>
  </g>

  <!-- moving packets -->
  <g class="motion">
    <circle r="4" fill="#55e7ff" filter="url(#glow-cyan)"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#route-people"/></animateMotion></circle>
    <circle r="4" fill="#ffb84d"><animateMotion dur="3.8s" begin="-.9s" repeatCount="indefinite"><mpath href="#route-money"/></animateMotion></circle>
    <circle r="4" fill="#9a84ff"><animateMotion dur="3.2s" begin="-1.8s" repeatCount="indefinite"><mpath href="#route-data"/></animateMotion></circle>
    <circle r="4" fill="#b4ff68" filter="url(#glow-lime)"><animateMotion dur="4s" begin="-2.7s" repeatCount="indefinite"><mpath href="#route-judgment"/></animateMotion></circle>
    <circle r="5" fill="#b4ff68" filter="url(#glow-lime)"><animateMotion dur="2.2s" begin="-.5s" repeatCount="indefinite"><mpath href="#route-output"/></animateMotion></circle>
  </g>

  <!-- processor -->
  <g class="orbit-a">
    <circle cx="1267" cy="370" r="113" fill="none" stroke="#283242" stroke-width="1.5" stroke-dasharray="5 12"/>
    <circle cx="1267" cy="257" r="4" fill="#55e7ff" filter="url(#glow-cyan)"/>
    <circle cx="1267" cy="483" r="3" fill="#b4ff68"/>
  </g>
  <g class="orbit-b">
    <circle cx="1267" cy="370" r="91" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="58 514"/>
    <circle cx="1358" cy="370" r="3" fill="#ff5ab3"/>
  </g>
  <circle cx="1267" cy="370" r="70" fill="url(#core)" stroke="#344052"/>
  <circle cx="1267" cy="370" r="60" fill="none" stroke="#1d2734"/>
  <path d="M1238 370H1296M1267 341V399" stroke="#263346" stroke-width="1"/>
  <text x="1267" y="350" text-anchor="middle" class="mono" font-size="9" fill="#667286">CURRENT STATE</text>
  <g text-anchor="middle" class="mono" font-size="17" font-weight="700">
    <text x="1267" y="381" class="phase" fill="#55e7ff">MODEL</text>
    <text x="1267" y="381" class="phase phase-2" fill="#9a84ff">BUILD</text>
    <text x="1267" y="381" class="phase phase-3" fill="#ffb84d">VERIFY</text>
    <text x="1267" y="381" class="phase phase-4" fill="#b4ff68">SHIP</text>
  </g>
  <text x="1267" y="404" text-anchor="middle" class="mono" font-size="8" fill="#526074">HUMAN IN LOOP</text>

  <!-- output -->
  <rect x="1054" y="590" width="426" height="44" rx="9" fill="#0d131a" stroke="#2f3b31"/>
  <rect x="1054" y="634" width="426" height="2" fill="#18231d"/>
  <rect x="1054" y="634" width="426" height="2" fill="url(#signal)" class="bar"/>
  <text x="1071" y="608" class="mono" font-size="8" fill="#607063">OUTPUT / VERIFIED</text>
  <text x="1071" y="624" class="mono" font-size="11" fill="#dce5df">WORKING SYSTEM</text>
  <text x="1459" y="619" text-anchor="end" class="mono" font-size="10" fill="#b4ff68">SHIP ↗</text>

  <!-- footer ticker -->
  <path d="M28 682H1572" stroke="#252c39"/>
  <g clip-path="url(#screen)">
    <g class="ticker">
      <text x="74" y="712" class="mono" font-size="10" fill="#55e7ff">VANTNOD: PRE-LAUNCH</text>
      <text x="310" y="712" class="mono" font-size="10" fill="#596577">◆</text>
      <text x="344" y="712" class="mono" font-size="10" fill="#ffb84d">RELEASE TARGET: Q3-Q4 2026</text>
      <text x="624" y="712" class="mono" font-size="10" fill="#596577">◆</text>
      <text x="658" y="712" class="mono" font-size="10" fill="#9a84ff">OPEN SOURCE: ACTIVE</text>
      <text x="875" y="712" class="mono" font-size="10" fill="#596577">◆</text>
      <text x="909" y="712" class="mono" font-size="10" fill="#b4ff68">SOURCE OVER THEATRE</text>
      <text x="1166" y="712" class="mono" font-size="10" fill="#596577">◆</text>
      <text x="1200" y="712" class="mono" font-size="10" fill="#9ca6b8">BUILD / OBSERVE / COMPOUND</text>
    </g>
  </g>
</svg>
