<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">EvalRail</title><desc id="desc">Local-first prompt regression tests compare expected and current output.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100a"/><stop offset="1" stop-color="#07090e"/></linearGradient><linearGradient id="pass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb84d"/><stop offset="1" stop-color="#b4ff68"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#29261a"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.1em}.scan{animation:scan 3.6s cubic-bezier(.4,0,.2,1) infinite}.pass{animation:pass 2.4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}@keyframes scan{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(246px);opacity:0}}@keyframes pass{0%,100%{opacity:.5}50%{opacity:1}}@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.2}}@media(prefers-reduced-motion:reduce){.scan,.pass,.cursor{animation:none!important}}</style></defs>
  <rect width="760" height="360" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="758" height="358" rx="21" fill="none" stroke="#3c392a"/><rect x="1" y="1" width="758" height="358" rx="21" fill="url(#grid)" opacity=".2"/>
  <text x="34" y="43" class="mono" font-size="11" fill="#ffb84d">OPEN SYSTEM / 03</text><circle cx="706" cy="38" r="4" fill="#b4ff68" class="pass"/><text x="693" y="42" text-anchor="end" class="mono" font-size="9" fill="#b4ff68">8 / 8 PASS</text>
  <text x="34" y="105" font-size="36" font-weight="780" letter-spacing="-1.4" fill="#f4f7fb">evalrail</text><text x="34" y="137" font-size="14" fill="#a39d8b">Prompts deserve regression tests.</text>
  <text x="34" y="191" class="mono" font-size="10" fill="#756f59">LOCAL-FIRST EVIDENCE</text><path d="M34 205H294" stroke="#3a3625"/><text x="34" y="232" font-size="12" fill="#d0ccbf">snapshots</text><text x="118" y="232" fill="#625c49">/</text><text x="138" y="232" font-size="12" fill="#d0ccbf">providers</text><text x="219" y="232" fill="#625c49">/</text><text x="239" y="232" font-size="12" fill="#d0ccbf">CI</text>
  <rect x="34" y="293" width="108" height="30" rx="15" fill="#17160f" stroke="#4a4226"/><text x="88" y="312" text-anchor="middle" class="mono" font-size="9" fill="#b5a977">TYPESCRIPT</text><rect x="151" y="293" width="103" height="30" rx="15" fill="#13180e" stroke="#35452b"/><text x="202" y="312" text-anchor="middle" class="mono" font-size="9" fill="#9cb78a">CI READY</text>
  <rect x="355" y="55" width="365" height="250" rx="16" fill="#0c0d0a" stroke="#383628"/>
  <text x="379" y="82" class="mono" font-size="9" fill="#77715e">PROMPT / INVOICE_EXTRACTION</text>
  <g class="mono" font-size="9"><text x="379" y="113" fill="#625f53">01</text><text x="407" y="113" fill="#bbb7aa">required keys</text><text x="668" y="113" text-anchor="end" fill="#b4ff68">PASS</text><text x="379" y="144" fill="#625f53">02</text><text x="407" y="144" fill="#bbb7aa">amount tolerance</text><text x="668" y="144" text-anchor="end" fill="#b4ff68">PASS</text><text x="379" y="175" fill="#625f53">03</text><text x="407" y="175" fill="#bbb7aa">source citation</text><text x="668" y="175" text-anchor="end" fill="#b4ff68">PASS</text><text x="379" y="206" fill="#625f53">04</text><text x="407" y="206" fill="#bbb7aa">provider parity</text><text x="668" y="206" text-anchor="end" fill="#ffb84d">+0.02</text></g>
  <path d="M379 126H690M379 157H690M379 188H690M379 219H690" stroke="#28281f"/>
  <rect x="379" y="238" width="290" height="34" rx="8" fill="#10160d" stroke="#35452b"/><rect x="390" y="249" width="246" height="12" rx="6" fill="#1a2115"/><rect x="390" y="249" width="246" height="12" rx="6" fill="url(#pass)" opacity=".85"/><circle cx="390" cy="255" r="5" fill="#fff4c9" filter="url(#glow)" class="scan"/><text x="681" y="261" class="mono" font-size="9" fill="#b4ff68">OK</text>
  <rect x="379" y="287" width="7" height="2" fill="#ffb84d" class="cursor"/><text x="394" y="291" class="mono" font-size="8" fill="#716b59">NO SILENT REGRESSIONS</text>
</svg>
