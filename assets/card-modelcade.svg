<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Modelcade</title><desc id="desc">Multiple model providers route through one typed interface with fallbacks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0b18"/><stop offset="1" stop-color="#07090e"/></linearGradient><linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a84ff"/><stop offset="1" stop-color="#ff5ab3"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#201b32"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="pa" d="M416 111 C471 111 474 159 513 172"/><path id="pb" d="M416 180 H513"/><path id="pc" d="M416 249 C471 249 474 201 513 188"/><path id="po" d="M579 180H683"/>
    <style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.1em}.routes{stroke-dasharray:4 7;animation:dash 6s linear infinite}.hub{transform-origin:546px 180px;animation:spin 12s linear infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-66}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.routes,.hub,.pulse{animation:none!important}.motion{display:none}}</style>
  </defs>
  <rect width="760" height="360" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="758" height="358" rx="21" fill="none" stroke="#302b44"/><rect x="1" y="1" width="758" height="358" rx="21" fill="url(#grid)" opacity=".2"/>
  <text x="34" y="43" class="mono" font-size="11" fill="#9a84ff">OPEN SYSTEM / 02</text><circle cx="706" cy="38" r="4" fill="#ff5ab3" class="pulse"/><text x="693" y="42" text-anchor="end" class="mono" font-size="9" fill="#ff7fc2">ROUTING</text>
  <text x="34" y="105" font-size="36" font-weight="780" letter-spacing="-1.4" fill="#f4f7fb">modelcade</text><text x="34" y="137" font-size="14" fill="#9992ad">Many providers. One typed interface.</text>
  <text x="34" y="191" class="mono" font-size="10" fill="#686079">CONTROL PLANE</text><path d="M34 205H294" stroke="#322b43"/><text x="34" y="232" font-size="12" fill="#cbc6d5">stream</text><text x="101" y="232" fill="#544a67">/</text><text x="121" y="232" font-size="12" fill="#cbc6d5">tools</text><text x="171" y="232" fill="#544a67">/</text><text x="191" y="232" font-size="12" fill="#cbc6d5">fallback</text><text x="259" y="232" fill="#544a67">/</text><text x="279" y="232" font-size="12" fill="#cbc6d5">trace</text>
  <rect x="34" y="293" width="108" height="30" rx="15" fill="#141120" stroke="#3c3154"/><text x="88" y="312" text-anchor="middle" class="mono" font-size="9" fill="#aa9bc9">TYPESCRIPT</text><rect x="151" y="293" width="124" height="30" rx="15" fill="#141120" stroke="#462c48"/><text x="213" y="312" text-anchor="middle" class="mono" font-size="9" fill="#bd90b6">FALLBACKS</text>
  <rect x="355" y="55" width="365" height="250" rx="16" fill="#0a0a12" stroke="#302b42"/>
  <use href="#pa" fill="none" stroke="#3c3452" class="routes"/><use href="#pb" fill="none" stroke="#3c3452" class="routes"/><use href="#pc" fill="none" stroke="#3c3452" class="routes"/><use href="#po" fill="none" stroke="#3c3452" class="routes"/>
  <g class="mono" font-size="9"><rect x="382" y="92" width="68" height="38" rx="9" fill="#11101c" stroke="#463b61"/><text x="416" y="115" text-anchor="middle" fill="#a99cc6">MODEL_A</text><rect x="382" y="161" width="68" height="38" rx="9" fill="#11101c" stroke="#463b61"/><text x="416" y="184" text-anchor="middle" fill="#a99cc6">MODEL_B</text><rect x="382" y="230" width="68" height="38" rx="9" fill="#11101c" stroke="#463b61"/><text x="416" y="253" text-anchor="middle" fill="#a99cc6">MODEL_C</text></g>
  <g class="hub"><circle cx="546" cy="180" r="43" fill="#100e1a" stroke="#5b4f75"/><circle cx="546" cy="180" r="33" fill="none" stroke="url(#route)" stroke-width="2" stroke-dasharray="36 172"/><circle cx="546" cy="137" r="4" fill="#9a84ff" filter="url(#glow)"/></g><text x="546" y="176" text-anchor="middle" class="mono" font-size="8" fill="#766b8c">ROUTER</text><text x="546" y="193" text-anchor="middle" class="mono" font-size="10" fill="#f2eef9">ATTEMPT 02</text>
  <g class="motion"><circle r="4" fill="#9a84ff" filter="url(#glow)"><animateMotion dur="3.1s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle><circle r="4" fill="#ff5ab3" filter="url(#glow)"><animateMotion dur="2.6s" begin="-1.4s" repeatCount="indefinite"><mpath href="#po"/></animateMotion></circle></g>
  <rect x="624" y="155" width="72" height="50" rx="10" fill="#17101a" stroke="#55304d"/><text x="660" y="176" text-anchor="middle" class="mono" font-size="8" fill="#8a657f">ONE API</text><text x="660" y="193" text-anchor="middle" class="mono" font-size="10" fill="#ff86c6">READY</text>
  <text x="382" y="289" class="mono" font-size="8" fill="#675f76">FAILURE IS A ROUTE, NOT A DEAD END.</text>
</svg>
