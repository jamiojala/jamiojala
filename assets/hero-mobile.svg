<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Jami Ojala. Messy in. Systems out.</title>
  <desc id="desc">A mobile animated operator console routes people, money, data, and judgment through a model, build, verify, and ship loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/><stop offset=".58" stop-color="#0a0d14"/><stop offset="1" stop-color="#090713"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e7ff"/><stop offset=".52" stop-color="#8d7cff"/><stop offset="1" stop-color="#b4ff68"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="64%">
      <stop offset="0" stop-color="#151d2a"/><stop offset=".72" stop-color="#0c1018"/><stop offset="1" stop-color="#080a0f"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c2330"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="24" y="24" width="752" height="1032" rx="23"/></clipPath>
    <path id="r1" d="M177 650 C245 650 257 690 302 711"/><path id="r2" d="M177 840 C245 840 258 797 302 776"/>
    <path id="r3" d="M623 650 C555 650 543 690 498 711"/><path id="r4" d="M623 840 C555 840 542 797 498 776"/>
    <path id="ro" d="M400 841 V918"/>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing:.12em; }
      .route { fill:none; stroke:#293344; stroke-width:1.5; stroke-linecap:round; stroke-dasharray:4 7; animation:route 8s linear infinite; }
      .oa { transform-origin:400px 746px; animation:spin 22s linear infinite; }
      .ob { transform-origin:400px 746px; animation:rev 14s linear infinite; }
      .pulse { animation:pulse 2.4s ease-in-out infinite; }
      .blink { animation:blink 1.5s steps(2,end) infinite; }
      .phase { opacity:0; animation:phase 8s ease-in-out infinite; }.p2{animation-delay:2s}.p3{animation-delay:4s}.p4{animation-delay:6s}
      .scan { animation:scan 7s cubic-bezier(.4,0,.2,1) infinite; }
      .bar { animation:bar 3.2s cubic-bezier(.4,0,.2,1) infinite; transform-origin:126px 969px; }
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes rev{to{transform:rotate(-360deg)}}
      @keyframes route{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.2}}@keyframes phase{0%,20%{opacity:1}25%,100%{opacity:0;transform:translateY(-4px)}}
      @keyframes scan{0%{transform:translateY(-70px);opacity:0}12%{opacity:.6}70%{opacity:.16}100%{transform:translateY(1080px);opacity:0}}
      @keyframes bar{0%,100%{transform:scaleX(.08)}54%{transform:scaleX(1)}}
      @media(prefers-reduced-motion:reduce){.route,.oa,.ob,.pulse,.blink,.scan,.bar{animation:none!important}.motion{display:none}.phase{animation:none;opacity:0}.p4{opacity:1}.bar{transform:scaleX(1)}}
    </style>
  </defs>
  <rect width="800" height="1080" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="1032" rx="23" fill="none" stroke="#252c39"/>
  <g clip-path="url(#screen)"><rect x="24" y="24" width="752" height="1032" fill="url(#grid)" opacity=".32"/><circle cx="402" cy="760" r="330" fill="#5c4cff" opacity=".04"/><g class="scan"><rect x="24" width="752" height="60" fill="url(#signal)" opacity=".055"/></g></g>
  <circle cx="55" cy="57" r="5" fill="#ff5f57"/><circle cx="73" cy="57" r="5" fill="#febc2e"/><circle cx="91" cy="57" r="5" fill="#28c840"/>
  <text x="116" y="62" class="mono" font-size="11" fill="#8d96a8">JAMI_OS / MOBILE</text>
  <circle cx="727" cy="57" r="5" fill="#aaff72" filter="url(#glow)" class="blink"/><text x="712" y="62" text-anchor="end" class="mono" font-size="11" fill="#aaff72">LIVE</text>
  <path d="M24 88H776" stroke="#252c39"/>

  <text x="50" y="130" class="mono" font-size="13" fill="#55e7ff">JAMI OJALA / FOUNDER-OPERATOR</text>
  <text x="48" y="222" font-size="86" font-weight="800" letter-spacing="-4.5" fill="#f5f7fb">MESSY IN.</text>
  <text x="48" y="313" font-size="86" font-weight="800" letter-spacing="-4.5" fill="#f5f7fb">SYSTEMS</text>
  <text x="48" y="404" font-size="86" font-weight="800" letter-spacing="-4.5" fill="url(#signal)">OUT.</text>
  <path d="M50 438H750" stroke="#252e3b"/><path d="M50 438H295" stroke="url(#signal)" stroke-width="2"/>
  <text x="50" y="480" font-size="21" font-weight="520" fill="#d5dae4">Software that survives contact with reality.</text>
  <text x="50" y="514" font-size="15" fill="#858fa3">Product systems × applied AI × operations</text>
  <g transform="translate(50 546)">
    <rect width="142" height="38" rx="19" fill="#0d121b" stroke="#263346"/><circle cx="19" cy="19" r="4" fill="#55e7ff" class="pulse"/><text x="35" y="24" class="mono" font-size="10" fill="#a7afbd">PRODUCT</text>
    <g transform="translate(153)"><rect width="102" height="38" rx="19" fill="#0d121b" stroke="#332e4a"/><circle cx="19" cy="19" r="4" fill="#9a84ff" class="pulse" style="animation-delay:.5s"/><text x="35" y="24" class="mono" font-size="10" fill="#a7afbd">AI</text></g>
    <g transform="translate(266)"><rect width="170" height="38" rx="19" fill="#0d121b" stroke="#39442e"/><circle cx="19" cy="19" r="4" fill="#b4ff68" class="pulse" style="animation-delay:1s"/><text x="35" y="24" class="mono" font-size="10" fill="#a7afbd">OPERATIONS</text></g>
  </g>

  <rect x="50" y="610" width="700" height="390" rx="17" fill="#090c12" stroke="#2a3240"/>
  <path d="M50 655H750" stroke="#242c38"/>
  <text x="74" y="638" class="mono" font-size="10" fill="#d3d8e2">OPERATOR LOOP</text><text x="725" y="638" text-anchor="end" class="mono" font-size="9" fill="#7d8798">RUNNING / 04</text>
  <use href="#r1" class="route"/><use href="#r2" class="route"/><use href="#r3" class="route"/><use href="#r4" class="route"/><use href="#ro" class="route"/>

  <g>
    <rect x="75" y="628" width="102" height="44" rx="9" fill="#101620" stroke="#2a3e50"/><text x="89" y="647" class="mono" font-size="8" fill="#59677a">INPUT / 01</text><text x="89" y="662" class="mono" font-size="10" fill="#dce4ed">PEOPLE</text><circle cx="170" cy="650" r="4" fill="#55e7ff"/>
    <rect x="75" y="818" width="102" height="44" rx="9" fill="#101620" stroke="#493a2b"/><text x="89" y="837" class="mono" font-size="8" fill="#74624d">INPUT / 02</text><text x="89" y="852" class="mono" font-size="10" fill="#dce4ed">MONEY</text><circle cx="170" cy="840" r="4" fill="#ffb84d"/>
    <rect x="623" y="628" width="102" height="44" rx="9" fill="#101620" stroke="#3e3656"/><text x="637" y="647" class="mono" font-size="8" fill="#6e6488">INPUT / 03</text><text x="637" y="662" class="mono" font-size="10" fill="#dce4ed">DATA</text><circle cx="630" cy="650" r="4" fill="#9a84ff"/>
    <rect x="623" y="818" width="102" height="44" rx="9" fill="#101620" stroke="#3b472e"/><text x="637" y="837" class="mono" font-size="8" fill="#657653">INPUT / 04</text><text x="637" y="852" class="mono" font-size="10" fill="#dce4ed">JUDGMENT</text><circle cx="630" cy="840" r="4" fill="#b4ff68"/>
  </g>
  <g class="motion">
    <circle r="4" fill="#55e7ff" filter="url(#glow)"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
    <circle r="4" fill="#ffb84d"><animateMotion dur="3.8s" begin="-.9s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle>
    <circle r="4" fill="#9a84ff"><animateMotion dur="3.2s" begin="-1.8s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion></circle>
    <circle r="4" fill="#b4ff68" filter="url(#glow)"><animateMotion dur="4s" begin="-2.7s" repeatCount="indefinite"><mpath href="#r4"/></animateMotion></circle>
    <circle r="5" fill="#b4ff68" filter="url(#glow)"><animateMotion dur="2.2s" begin="-.5s" repeatCount="indefinite"><mpath href="#ro"/></animateMotion></circle>
  </g>

  <g class="oa"><circle cx="400" cy="746" r="102" fill="none" stroke="#283242" stroke-width="1.5" stroke-dasharray="5 12"/><circle cx="400" cy="644" r="4" fill="#55e7ff" filter="url(#glow)"/><circle cx="400" cy="848" r="3" fill="#b4ff68"/></g>
  <g class="ob"><circle cx="400" cy="746" r="82" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="54 462"/><circle cx="482" cy="746" r="3" fill="#ff5ab3"/></g>
  <circle cx="400" cy="746" r="64" fill="url(#core)" stroke="#344052"/><circle cx="400" cy="746" r="54" fill="none" stroke="#1d2734"/>
  <path d="M374 746H426M400 720V772" stroke="#263346"/><text x="400" y="730" text-anchor="middle" class="mono" font-size="8" fill="#667286">CURRENT STATE</text>
  <g text-anchor="middle" class="mono" font-size="16" font-weight="700"><text x="400" y="756" class="phase" fill="#55e7ff">MODEL</text><text x="400" y="756" class="phase p2" fill="#9a84ff">BUILD</text><text x="400" y="756" class="phase p3" fill="#ffb84d">VERIFY</text><text x="400" y="756" class="phase p4" fill="#b4ff68">SHIP</text></g>
  <text x="400" y="778" text-anchor="middle" class="mono" font-size="8" fill="#526074">HUMAN IN LOOP</text>

  <rect x="126" y="916" width="548" height="53" rx="9" fill="#0d131a" stroke="#2f3b31"/><text x="144" y="937" class="mono" font-size="8" fill="#607063">OUTPUT / VERIFIED</text><text x="144" y="956" class="mono" font-size="11" fill="#dce5df">WORKING SYSTEM</text><text x="652" y="951" text-anchor="end" class="mono" font-size="10" fill="#b4ff68">SHIP ↗</text>
  <rect x="126" y="968" width="548" height="2" fill="#18231d"/><rect x="126" y="968" width="548" height="2" fill="url(#signal)" class="bar"/>
  <path d="M24 1017H776" stroke="#252c39"/><text x="50" y="1041" class="mono" font-size="9" fill="#55e7ff">VANTNOD: LIVE</text><text x="264" y="1041" class="mono" font-size="9" fill="#9a84ff">OPEN SOURCE: ACTIVE</text><text x="565" y="1041" class="mono" font-size="9" fill="#b4ff68">ESPOO, FINLAND</text>
</svg>
